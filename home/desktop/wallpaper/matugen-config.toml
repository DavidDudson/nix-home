[config]
version_check = false
fallback_color = "#ff9800"
prefer = "closest-to-fallback"

[config.wallpaper]
command = "true" # required by matugen 4.0; no-op since set = false
set = false # awww handles wallpaper setting

[templates.hyprland-colors]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.waybar-colors]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.mako-config]
input_path = "~/.config/matugen/templates/mako-config"
output_path = "~/.config/mako/config"
post_hook = "makoctl reload || true"
