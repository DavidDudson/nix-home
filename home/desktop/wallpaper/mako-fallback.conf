# Fallback mako config — replaced by matugen on first wallpaper change.
# @papirusIconPath@ is substituted at build time by mako.nix.

width=400
height=150
margin=20
padding=15
border-size=2
border-radius=10

icons=true
max-icon-size=64
icon-path=@papirusIconPath@

default-timeout=5000
ignore-timeout=true

font=FiraCode Nerd Font 11

anchor=top-right

background-color=#141414
text-color=#fff3e0
border-color=#ff9800
progress-color=over #1a1a1a

[urgency=low]
border-color=#ff9800
default-timeout=3000

[urgency=normal]
border-color=#ff9800
default-timeout=5000

[urgency=high]
border-color=#ff5722
text-color=#ff5722
default-timeout=0
