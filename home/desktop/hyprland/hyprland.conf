# Hyprland main configuration

# Variables
$terminal = ghostty
$fileManager = ghostty -e nu -c yazi
$mainMod = SUPER

# Monitor
monitor = ,preferred,auto,auto

# Startup applications
exec-once = [workspace 1 silent] zed
exec-once = [workspace 2 silent] vivaldi
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 5 silent] 1password
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = awww-daemon
# Launch Variety with the persisted theme profile (~/.config/variety-profiles/<theme>/).
exec-once = ~/.local/bin/variety-theme start
exec-once = hypridle
exec-once = vicinae server
exec-once = ~/.local/bin/fetch-secrets

# Scratchpad apps — live on hidden special workspaces, toggled by F-keys.
exec-once = [workspace special:btop silent] $terminal -e btop
exec-once = [workspace special:notes silent] zed ~/scratchpad.md

# Register hyprexpo overview keybind after the plugin has loaded. The
# plugin's `hyprexpo:expo` dispatcher isn't known at initial config parse
# (home-manager exec-once loads the plugin), so we register the bind via
# hyprctl once the plugin is initialised.
exec-once = sh -c 'sleep 1 && hyprctl keyword bind "SUPER, TAB, hyprexpo:expo, toggle"'

# Misc
misc {
    focus_on_activate = true
}

# Environment variables
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_DRM_NO_ATOMIC,1
env = __NV_PRIME_RENDER_OFFLOAD,1
env = GBM_BACKEND,nvidia-drm
env = NIXOS_OZONE_WL,1

# Source split configs
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/rules.conf
