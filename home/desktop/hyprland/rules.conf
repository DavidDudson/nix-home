# Window and workspace rules

# Workspace 1 — Development
windowrule = match:class code-url-handler, workspace 1
windowrule = match:class jetbrains-rustrover, workspace 1

# Workspace 2 — Browsers
windowrule = match:class vivaldi-stable, workspace 2
windowrule = match:class Vivaldi-stable, workspace 2
windowrule = match:class firefox, workspace 2
windowrule = match:class chromium, workspace 2

# Workspace 3 — Music & Media
windowrule = match:class Spotify, workspace 3
windowrule = match:title Spotify, workspace 3
windowrule = match:class vlc, workspace 3

# Workspace 4 — Gaming & Game Dev
windowrule = match:class Aseprite, workspace 4
windowrule = match:class aseprite, workspace 4
windowrule = match:class org.mapeditor.Tiled, workspace 4
windowrule = match:class qrenderdoc, workspace 4
windowrule = match:title Tracy Profiler, workspace 4
windowrule = match:class steam, workspace 4
windowrule = match:class Steam, workspace 4

# Workspace 5 — System & Settings
windowrule = match:class 1password, workspace 5
windowrule = match:class 1Password, workspace 5
windowrule = match:class nwg-look, workspace 5

# Floating dialog apps — pop up centered on current workspace instead of
# grabbing a dedicated tile. Size is a reasonable default; drag to resize.
# Hyprland 0.54+ requires `<action> on`/`<action> <value>` form with the
# matcher after the comma; bare `float`/`center` fail to parse.
windowrule = float on, match:class (pavucontrol|org\.pulseaudio\.pavucontrol)
windowrule = center on, match:class (pavucontrol|org\.pulseaudio\.pavucontrol)
windowrule = size 900 650, match:class (pavucontrol|org\.pulseaudio\.pavucontrol)
windowrule = float on, match:class blueman-manager
windowrule = center on, match:class blueman-manager
windowrule = size 700 500, match:class blueman-manager
windowrule = float on, match:class nm-connection-editor
windowrule = center on, match:class nm-connection-editor
windowrule = size 800 600, match:class nm-connection-editor

# Workspace 6 — Chat
windowrule = match:class discord, workspace 6
windowrule = match:class Discord, workspace 6

# Claude popout — floating side-panel chat on a special workspace,
# anchored to right-edge at 15% width × full height. Toggled via
# SUPER+A or the waybar icon (claude-popout-toggle).
windowrule = float on, match:class com.popout.claude
windowrule = size 15% 100%, match:class com.popout.claude
windowrule = move 85% 0, match:class com.popout.claude
windowrule = workspace special:claude silent, match:class com.popout.claude

# Suppress maximize events
windowrule = match:class .*, suppress_event maximize

# Steam/game launcher fix for empty windows
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# Smart gaps — remove gaps when only one tiled window, keep top gap for waybar
workspace = w[tv1], gapsout:10 0 0 0, gapsin:0
workspace = f[1], gapsout:10 0 0 0, gapsin:0

# Per-workspace identity gaps. Music breathes; gaming runs flush.
workspace = 3, gapsout:30
workspace = 4, gapsout:0, gapsin:0

# Remove rounding on single-window workspaces
windowrule = match:workspace w[tv1], border_size 0
windowrule = match:workspace w[tv1], rounding 0
windowrule = match:workspace f[1], border_size 0
windowrule = match:workspace f[1], rounding 0

# Vicinae launcher layer rules
layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

layerrule {
    name = vicinae-no-animation
    no_anim = on
    match:namespace = vicinae
}

# Frosted-glass bars and menus — blur everything behind waybar and rofi so
# they inherit wallpaper tones rather than flat background. Hyprland 0.54
# renamed `ignorezero` to `ignore_alpha` and now expects value-first form.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
