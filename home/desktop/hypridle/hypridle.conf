# hypridle config — non-locking animated screensaver via mpvpaper.
# No lock, no dpms — just a full-screen video loop after idle.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 5 minutes idle → launch mpvpaper screensaver.
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/screensaver-start
    on-resume = ~/.config/hypr/screensaver-stop
}
