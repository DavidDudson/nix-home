# No prefix and no status bar, so every key reaches the app in the pane.
set -g prefix None
unbind C-b
set -g status off
# Forward modified keys (Shift/Ctrl/Alt chords) to the pane app
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
# Apps must not overwrite the pane titles the workspace manager sets
set -g allow-set-title off
set -as terminal-overrides ',*:RGB'
set -g pane-border-style fg=black
set -g pane-active-border-style fg=black
